name: Compilar APK Android PuntoKampus

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependencias de Flutter
        run: |
          cd app
          flutter pub get

      - name: 🧪 Ejecutar pruebas automáticas
        run: |
          cd app
          flutter test

      - name: 🔨 Compilar APK Release
        run: |
          cd app
          flutter build apk --release

      - name: 📤 Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: puntokampus-apk-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
