name: Compilar APK Android PuntoKampus

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar estructura oficial nativa de Android
        working-directory: app
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          rm -rf android
          flutter create --org ec.edu.utb --project-name puntokampus --platforms=android .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "android.lint.abortOnError=false" >> android/gradle.properties

      - name: 📦 Instalar dependencias de Flutter
        working-directory: app
        run: flutter pub get

      - name: 🧪 Ejecutar pruebas automáticas
        working-directory: app
        run: flutter test

      - name: 🔨 Compilar APK Release
        working-directory: app
        run: flutter build apk --release

      - name: 📤 Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: puntokampus-apk-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publicar APK en GitHub Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: release-apk
          name: "PuntoKampus UTB (Última versión APK)"
          body: |
            ### 📱 PuntoKampus UTB - APK Release Oficial
            - Diseño visual Warm Minimalism.
            - Corrección de selección de puntos de entrega.
            - Descarga directa del APK sin descomprimir zip.
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
